* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; display: flex; flex-direction: column; gap: 10px; }
h1 { margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 0.86rem; }
header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: flex-end; justify-content: space-between; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; font-variant-numeric: tabular-nums; }
.stats div { display: flex; gap: 6px; align-items: baseline; }
.stats b { font-size: 1.05rem; font-weight: 600; }
.stats span { color: var(--muted); font-size: 0.8rem; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 10px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; }
.group { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; min-width: 0; }
.group > label.t { color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; margin-right: 2px; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 3px 9px 3px 7px; border: 1px solid var(--line); border-radius: 99px;
  background: var(--surface); color: var(--ink); font: inherit; font-size: 0.8rem; cursor: pointer; }
.chip[aria-pressed="false"] { color: var(--muted); background: transparent; }
.chip[aria-pressed="false"] .sw { opacity: 0.3; }
.sw { width: 18px; height: 0; border-top: 2.5px solid currentColor; display: inline-block; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.74rem; }
input[type="search"], select { font: inherit; font-size: 0.84rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; min-width: 0; max-width: 100%; }
input[type="search"] { width: 15ch; }
button.tool { font: inherit; font-size: 0.82rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button.tool:hover, .chip:hover { border-color: var(--accent); }
button:focus-visible, .chip:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { flex: 1; min-height: 420px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 10px; }
#stage { position: relative; min-height: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
svg#g { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
svg#g.drag { cursor: grabbing; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; padding: 0; font-size: 1.1rem; line-height: 1; }
.hint { position: absolute; left: 10px; bottom: 8px; color: var(--muted); font-size: 0.74rem; pointer-events: none; background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 2px 6px; border-radius: 4px; }
aside { min-height: 0; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
aside h2 { margin: 0 0 4px; font-size: 1.02rem; font-weight: 600; }
aside h3 { margin: 16px 0 6px; font-size: 0.72rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
aside p { margin: 6px 0; }
.id { font-family: var(--mono); font-size: 0.82rem; }
.quote { margin: 8px 0; padding: 8px 10px; background: var(--soft); border-radius: 6px; font-size: 0.86rem; overflow-wrap: anywhere; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 8px 0; font-size: 0.86rem; }
dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
ul.rel { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
ul.rel button { all: unset; display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 2px 8px; align-items: start; width: 100%; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 0.84rem; }
ul.rel button:hover { background: var(--soft); }
ul.rel button:focus-visible { outline: 2px solid var(--accent); }
ul.rel .sw { width: 14px; margin-top: 8px; border-top-width: 2px; }
ul.rel small { color: var(--muted); display: block; }
details { margin: 4px 0; } summary { cursor: pointer; font-size: 0.84rem; color: var(--muted); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 0.74rem; border: 1px solid var(--line); color: var(--muted); }
.tag.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
.legend { display: flex; flex-direction: column; gap: 5px; font-size: 0.82rem; }
.legend div { display: flex; gap: 8px; align-items: center; }
.legend svg { flex: none; }
.findings { padding-left: 18px; margin: 6px 0; } .findings li { margin: 3px 0; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
/* graph */
.edge { fill: none; stroke-width: 1.4; opacity: 0.8; }
.edge.inferred { stroke-dasharray: 6 4; }
.edge.pending { stroke-dasharray: 1.5 3.5; stroke-width: 2.2; stroke-linecap: round; }
.edge.off { display: none; }
.edge.dim, .hit.dim { opacity: 0.08; }
.edge.hl, .edge.hov { opacity: 1; stroke-width: 2.4; }
.edge.sel { opacity: 1; stroke-width: 3.2; }
.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.hit.off { display: none; }
.node { cursor: pointer; outline: none; }
.node rect.body { fill: color-mix(in srgb, var(--nc) 13%, var(--surface)); stroke: var(--nc); stroke-width: 1.3; }
.node text { fill: var(--ink); pointer-events: none; }
.node .nid { font: 500 10px var(--mono); fill: var(--muted); }
.node .nv { font: 500 11.5px var(--sans); }
.node.dim { opacity: 0.2; }
svg.far .nv { opacity: 0; } svg.farther .nid { opacity: 0; }
svg.far .node rect.body { stroke-width: 2; }
.node.up rect.body { stroke: var(--up); stroke-width: 2.4; }
.node.down rect.body { stroke: var(--down); stroke-width: 2.4; }
.node.sel rect.body { stroke: var(--ink); stroke-width: 3; }
.node.mark rect.body { stroke: var(--accent); stroke-width: 3; }
.node:focus-visible rect.body { stroke: var(--accent); stroke-width: 3.4; }
.node .root { fill: var(--surface); stroke: var(--nc); stroke-width: 1.5; }
.lane { font: 600 11px var(--sans); fill: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
@media (max-width: 900px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; }
  body { height: auto; } html { height: auto; }
  aside { max-height: none; }
}
@media (prefers-reduced-motion: no-preference) { .node, .edge { transition: opacity 0.12s; } }
